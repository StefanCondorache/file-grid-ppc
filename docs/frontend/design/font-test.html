<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileGrid · test fonturi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Manrope:wght@400;600;700&family=Onest:wght@400;600;700&family=Albert+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>
  body { margin: 24px; background: #fff; color: #232936; font-family: system-ui, sans-serif; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E1E1E1; align-items: baseline; }
  .name { font: 600 14px system-ui; color: #555C5F; }
  .big { font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
  .body { font-size: 16px; line-height: 1.5; font-weight: 400; margin-top: 6px; }
  .num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .zoom { font-size: 96px; font-weight: 400; line-height: 1; }
  #results { margin-top: 20px; font: 14px ui-monospace, monospace; white-space: pre; }
</style>
</head>
<body>
<h1 style="font: 700 20px system-ui; margin: 0 0 8px">Candidați pentru înlocuirea PingLCG — test ș ț (virgulă dedesubt)</h1>
<div id="rows"></div>
<div id="results">se măsoară…</div>
<script>
const fonts = ['Figtree', 'Manrope', 'Onest', 'Albert Sans', 'Plus Jakarta Sans'];
const rows = document.getElementById('rows');
for (const f of fonts) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="name">${f}</div><div style="font-family:'${f}'">
    <div class="big">Garanții de business · Rețele</div>
    <div class="body">Încărcare fișier dronă: conexiune pierdută, reîncercare în 8 s. Înregistrări de avarie disponibile pentru dispecerat. ȘANTIER ȚARĂ șanț țâșnește</div>
    <div class="num">1 024,5 MB · 98,7 % · 0123456789 · p95 1,2 s</div>
    <div class="zoom">ș ț Ș Ț ş ţ</div></div>`;
  rows.appendChild(r);
}
document.fonts.ready.then(() => {
  const c = document.createElement('canvas').getContext('2d');
  const w = (font, ch) => { c.font = font; return c.measureText(ch).width.toFixed(2); };
  const glyphs = ['ș','ț','Ș','Ț','ă','â','î'];
  const out = [];
  for (const f of fonts) {
    const res = glyphs.map(g => {
      const a = w(`100px "${f}", monospace`, g), b = w('100px monospace', g);
      return `${g}:${a === b ? 'FALLBACK' : 'ok'}`;
    });
    out.push(`${f.padEnd(18)} loaded=${document.fonts.check(`16px "${f}"`, 'șț')}  ${res.join(' ')}`);
  }
  document.getElementById('results').textContent = out.join('\n');
});
</script>
</body>
</html>
