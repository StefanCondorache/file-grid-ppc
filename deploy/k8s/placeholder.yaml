# Placeholder static pentru ppc.filegrid.cc.cd, pana apar frontend-ul/API-ul real FileGrid.
apiVersion: v1
kind: Namespace
metadata:
  name: filegrid
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: placeholder-site
  namespace: filegrid
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location = /healthz { default_type text/plain; return 200 "ok\n"; }
      location / { try_files $uri /index.html; }
    }
  index.html: |
    <!doctype html>
    <html lang="ro">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FileGrid PPC</title></head>
    <body style="font-family:sans-serif;text-align:center;margin-top:20vh">
    <h1>FileGrid PPC — în curând</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
  namespace: filegrid
spec:
  replicas: 1
  selector:
    matchLabels: {app: placeholder}
  template:
    metadata:
      labels: {app: placeholder}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: site, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: site, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
      volumes:
        - name: site
          configMap: {name: placeholder-site}
---
apiVersion: v1
kind: Service
metadata:
  name: placeholder
  namespace: filegrid
spec:
  type: ClusterIP
  selector: {app: placeholder}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placeholder
  namespace: filegrid
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ppc.filegrid.cc.cd]
      secretName: ppc-filegrid-tls
  rules:
    - host: ppc.filegrid.cc.cd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: placeholder
                port: {number: 80}
