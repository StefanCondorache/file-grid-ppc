# k3s HelmChartConfig pentru Traefik-ul inclus in k3s. Cheile sunt cele din chart-ul inclus in k3s v1.37.2+k3s1
# (traefik-41.6.101+up41.6.1; scripts/host-bootstrap.sh fixeaza aceasta versiune pe masini noi).
# - HTTP -> HTTPS redirect permanent pe entrypoint-ul `web`.
# - readTimeout pe `websecure`: implicit 60s in Traefik v3 si acopera citirea intregii cereri, cu tot corpul
#   (per stream la HTTP/2), deci un upload lent ar fi taiat dupa 60s. 900s = 15 minute per cerere, limitat
#   (nu 0) ca o conexiune lenta sa nu poata tine un worker la nesfarsit. Upload-urile mari: in bucati de 1-5 MB.
# - resources: limita de memorie, ca orice container de pe VPS-ul de 4 GB.
# - IP-ul real al clientului (contract cu backend-ul, README "Contracte pentru P2/P3"):
#   * externalTrafficPolicy: Local. Service-ul LoadBalancer are ca IP chiar IP-ul nodului (ServiceLB, ipMode VIP),
#     deci kube-proxy preia direct conexiunile catre IP-ul public; cu politica implicita Cluster le face SNAT
#     (Traefik vedea 10.42.0.1 pentru oricine), cu Local nu, iar Traefik vede IP-ul sursa real. Un singur nod,
#     deci Local nu pierde trafic.
#   * forwardedHeaders.trustedIPs = doar CIDR-ul podurilor (10.42.0.0/16, implicit k3s): X-Forwarded-* trimise de
#     un client din Internet sunt sterse, iar Traefik pune in X-Forwarded-For IP-ul de la care a primit conexiunea.
#     Exceptie acceptata: conexiunile care trec prin podul svclb-traefik (adrese ale nodului altele decat IP-ul
#     LoadBalancer, de ex. 127.0.0.1) ajung cu sursa = IP de pod, deci header-ele lor sunt pastrate.
#   Backend-ul crede X-Forwarded-For doar de la 10.42.0.0/16 si 10.43.0.0/16 (TRUSTED_PROXY_CIDRS).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        forwardedHeaders:
          trustedIPs: [10.42.0.0/16]
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        forwardedHeaders:
          trustedIPs: [10.42.0.0/16]
        transport:
          respondingTimeouts:
            readTimeout: 900s
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 256Mi
