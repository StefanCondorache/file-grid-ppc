# NestJS backend (backend/). Stateless (upload sessions live in Postgres), so capacity grows by adding replicas:
# the HPA (hpa.yaml) owns spec.replicas, which is deliberately absent here so re-applying never resets it.
# filegrid.io/storage-client=true is the label the filegrid-storage NetworkPolicies admit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filegrid-backend
  namespace: filegrid
spec:
  selector:
    matchLabels: {app: filegrid-backend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: filegrid-backend
        filegrid.io/storage-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: filegrid-backend
      # Token mounted (overrides the SA's false): the demo panel scales the storage StatefulSets through the
      # Kubernetes API with the Role bound in deploy/k8s/demo-rbac.yaml (chaos stream).
      automountServiceAccountToken: true
      # no FILEGRID_*_SERVICE_HOST/PORT link variables: they would collide with the app's FILEGRID_ settings prefix
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: filegrid-backend
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - secretRef: {name: filegrid-storage-credentials}
            - secretRef: {name: filegrid-app-secrets}
          env:
            # Password of the per-role demo accounts, separate from ADMIN_PASSWORD (scripts/k8s-app-secrets.sh adds
            # it). Already in envFrom; named here without `optional` so a Secret lacking the key blocks the pod
            # instead of letting the backend fall back to ADMIN_PASSWORD.
            - name: DEMO_USERS_PASSWORD
              valueFrom:
                secretKeyRef: {name: filegrid-app-secrets, key: DEMO_USERS_PASSWORD}
            - {name: FILEGRID_PG_HOST, value: postgres.filegrid-storage.svc.cluster.local}
            - {name: FILEGRID_PG_PORT, value: "5432"}
            - {name: FILEGRID_S3_ENDPOINT, value: "http://s3.filegrid-storage.svc.cluster.local:8333"}
            - {name: FILEGRID_FTP_HOST, value: ftp.filegrid-storage.svc.cluster.local}
            - {name: FILEGRID_FTP_PORT, value: "21"}
            # FTP budget: each process opens up to 2 data-operation connections + 1 health connection, so
            # 3 HPA replicas + 1 rolling-update surge = 4 x 3 = 12 control connections, below pure-ftpd's
            # FTP_MAX_CLIENTS (deploy/k8s/storage/ftp.yaml; the image default 5 is too low, raised at merge), and
            # 4 x 2 concurrent transfers fit the passive port range.
            - {name: FILEGRID_FTP_MAX_CONNECTIONS, value: "2"}
          # /readyz must stay 200 when a single storage is down (circuit breaker handles it), otherwise
          # one dead storage would pull every backend out of the Service.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
