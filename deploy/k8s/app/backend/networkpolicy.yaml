# Least privilege: the backend API is reachable only from Traefik (kube-system), pods of ns filegrid (frontend,
# simulator, blackbox) and Prometheus (ns monitoring). Kubelet probes come from the node and stay allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filegrid-backend
  namespace: filegrid
spec:
  podSelector:
    matchLabels: {app: filegrid-backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: filegrid}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports:
        - {protocol: TCP, port: 8000}
