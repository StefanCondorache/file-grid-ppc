# Least privilege: the simulator control endpoint (rate / storm) and /metrics accept only the backend (demo panel)
# and Prometheus (ns monitoring). Kubelet probes come from the node and stay allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filegrid-simulator
  namespace: filegrid
spec:
  podSelector:
    matchLabels: {app: filegrid-simulator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: filegrid-backend}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports:
        - {protocol: TCP, port: 8080}
