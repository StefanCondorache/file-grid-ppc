apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filegrid
labels:
  # includeTemplates: pod templates carry part-of/component too (make app-status lists pods); selectors untouched
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: filegrid-app
      app.kubernetes.io/component: simulator
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# METER_RATE is overridden at deploy time (make app-up METER_RATE=...); the hashed ConfigMap name makes a new
# rate roll the simulator pod.
configMapGenerator:
  - name: filegrid-simulator-config
    literals:
      - METER_RATE=10
