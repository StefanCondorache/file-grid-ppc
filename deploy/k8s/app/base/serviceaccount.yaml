# Identity of the backend pods. The only RBAC bound to it is deploy/k8s/demo-rbac.yaml (scale/read the storage
# StatefulSets in filegrid-storage for the demo panel). Tokens are not mounted by default; the backend pod spec
# opts in with automountServiceAccountToken: true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filegrid-backend
  namespace: filegrid
  labels:
    app.kubernetes.io/part-of: filegrid-app
automountServiceAccountToken: false
