apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filegrid
labels:
  # includeTemplates: pod templates carry part-of/component too (make app-status lists pods); selectors untouched
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: filegrid-app
      app.kubernetes.io/component: frontend
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
