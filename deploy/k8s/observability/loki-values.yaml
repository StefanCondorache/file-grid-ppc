# grafana/loki in mod SingleBinary: un singur pod, chunk-uri + index TSDB pe un PVC mic (local-path).
# Retentie 48h aplicata de compactor. Fara cache-uri memcached, gateway, canary sau teste (RAM limitat).
# Campurile JSON (trace_id, category, storage, operation, file_id) vin de la Alloy ca structured metadata,
# nu ca etichete (ar exploda cardinalitatea); se pot filtra direct sau cu `| json` la interogare.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 48h
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 2
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  extraEnv:
    - {name: GOMEMLIMIT, value: "210MiB"}
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: "1", memory: 256Mi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
memcached: {enabled: false}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
sidecar:
  rules: {enabled: false}
