# grafana/alloy ca DaemonSet: citeste logurile podurilor de pe nodul propriu din /var/log/pods (format CRI,
# containerd/k3s) si le trimite la Loki. Etichete (cardinalitate mica): namespace, pod, container, app.
# Din liniile JSON ale aplicatiei, trace_id/category/storage/operation/file_id devin structured metadata
# (interogabile: {namespace="filegrid"} | trace_id="..." sau | json | trace_id="..."), nu etichete.
controller:
  type: daemonset
# Least privilege: regulile implicite ale chart-ului dau get/list/watch pe configmaps+secrets in tot clusterul.
# Config-ul de mai jos foloseste doar discovery.kubernetes role=pod, deci ClusterRole-ul (generat de chart din
# rules+clusterRules) contine doar pods, namespaces si nodes (citire).
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "list", "watch"]
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
configReloader:
  resources:
    requests: {cpu: 5m, memory: 12Mi}
    limits: {cpu: 50m, memory: 24Mi}
alloy:
  mounts:
    varlog: true
  clustering: {enabled: false}
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 112Mi}
  extraEnv:
    - {name: GOMEMLIMIT, value: "90MiB"}
  configMap:
    content: |-
      // Podurile de pe nodul curent (chart-ul seteaza HOSTNAME = spec.nodeName).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app = app.kubernetes.io/name, altfel eticheta app, altfel numele containerului
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
          separator     = ";"
          regex         = "^;*([^;]+).*$"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        // Liniile non-JSON trec neschimbate (stage.json doar nu extrage nimic).
        stage.json {
          expressions = {trace_id = "", category = "", storage = "", operation = "", file_id = ""}
        }
        stage.structured_metadata {
          values = {trace_id = "", category = "", storage = "", operation = "", file_id = ""}
        }
        // filename (calea fisierului de log) ar dubla pod/container ca eticheta; nu o pastram.
        stage.label_drop {
          values = ["filename"]
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
