# Grafana pe acelasi host, sub /grafana (Traefik). TLS: Ingress-ul placeholder/frontend din namespace-ul filegrid
# detine certificatul Let's Encrypt (secret ppc-filegrid-tls, emis de cert-manager). Traefik alege certificatul dupa
# SNI din toate certificatele incarcate, deci aici `tls.hosts` fara secretName activeaza HTTPS pe router si refoloseste
# acelasi certificat; nu cerem al doilea certificat identic (limita Let's Encrypt de 5 duplicate/saptamana).
# DOMAIN inlocuieste ppc.filegrid.cc.cd la aplicare (obs-up).
# Header-ele de securitate: acelasi Middleware ca in namespace-ul filegrid (deploy/k8s/app/base/security-headers.yaml,
# HSTS 1 an fara includeSubDomains/preload, nosniff, Referrer-Policy, X-Frame-Options DENY), declarat si aici fiindca
# Traefik nu foloseste Middleware-uri din alt namespace. Pastrati-le identice.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: monitoring
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    stsPreload: false
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    frameDeny: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ppc.filegrid.cc.cd]
  rules:
    - host: ppc.filegrid.cc.cd
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port: {number: 80}
