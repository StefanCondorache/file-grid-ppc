# S3-compatible object storage: SeaweedFS all-in-one (master + volume + filer + S3 gateway).
# S3 auth is enforced with the admin credentials from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: filegrid-storage
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: s3}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  namespace: filegrid-storage
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: s3}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
        app.kubernetes.io/part-of: filegrid-storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          args:
            - server
            - -dir=/data
            - -filer
            - -s3
            - -s3.port=8333
            - -master.volumeSizeLimitMB=256
            - -volume.max=0   # 0 = auto: limit follows free disk
          ports:
            - {name: s3, containerPort: 8333}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: filegrid-storage-credentials, key: S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: filegrid-storage-credentials, key: S3_SECRET_KEY}}
          readinessProbe:
            # master reports the cluster up, and the S3 gateway answers (anonymous => 403, so no -f on it)
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
