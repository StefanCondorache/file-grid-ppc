# One-shot: creates bucket "filegrid" idempotently through the authenticated S3 API, then exits 0.
# Not in kustomization.yaml: scripts/k8s-s3-init.sh (run by `make k8s-storage-up`) applies it only when it has not
# completed, unchanged, on the current S3 volume, and then deletes the old run first (a Job template is immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  namespace: filegrid-storage
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-init
        app.kubernetes.io/part-of: filegrid-storage
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.40.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ep=http://s3.filegrid-storage.svc.cluster.local:8333
              if aws --endpoint-url $ep s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
                echo "bucket $S3_BUCKET already exists"
              else
                aws --endpoint-url $ep s3api create-bucket --bucket "$S3_BUCKET"
                echo "bucket $S3_BUCKET created"
              fi
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: filegrid-storage-credentials, key: S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: filegrid-storage-credentials, key: S3_SECRET_KEY}}
            - name: S3_BUCKET
              valueFrom: {secretKeyRef: {name: filegrid-storage-credentials, key: S3_BUCKET}}
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
