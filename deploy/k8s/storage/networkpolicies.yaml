# Only FileGrid app pods (namespace filegrid, label filegrid.io/storage-client=true) may reach the storages.
# Only ingress is restricted; egress (DNS etc.) stays open. k3s's kube-router rejects denied traffic with
# ICMP port-unreachable (clients see "connection refused"); `make storage-isolation-check` proves the rules.
# Probes: every storage readiness/liveness probe is an exec probe that runs inside its own container
# (pg_isready on the local socket, wget / bash /dev/tcp to 127.0.0.1), so probe traffic never crosses the pod
# network and these policies cannot affect it. What was verified: postgres-0, s3-0 and ftp-0 stayed 1/1 Ready
# with 0 restarts after the policies were applied. No httpGet/tcpSocket probes are used, so how kube-router
# treats kubelet-to-pod probe traffic was not tested.
---
# Default deny: every pod in filegrid-storage accepts no ingress unless another policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: filegrid-storage
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: filegrid-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: filegrid
          podSelector:
            matchLabels:
              filegrid.io/storage-client: "true"
      ports:
        - {protocol: TCP, port: 5432}
---
# s3-init (same namespace) also needs the S3 API to create the bucket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-s3
  namespace: filegrid-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: s3
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: filegrid
          podSelector:
            matchLabels:
              filegrid.io/storage-client: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: s3-init
      ports:
        - {protocol: TCP, port: 8333}
---
# FTP control port 21 plus the passive data range 21000-21019. Default clients (ftplib, curl) open the data
# connection to the Service ClusterIP on the passive port, which kube-proxy forwards to this pod; clients that
# trust the PASV address (PUBLICHOST = pod IP) reach the pod directly. Both arrive here as pod-to-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-ftp
  namespace: filegrid-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ftp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: filegrid
          podSelector:
            matchLabels:
              filegrid.io/storage-client: "true"
      ports:
        - {protocol: TCP, port: 21}
        - {protocol: TCP, port: 21000, endPort: 21019}
