apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The s3-init Job is deliberately NOT here: a finished Job's pod template is immutable, so `make k8s-storage-up`
# deletes and re-applies it separately (see Makefile). Secret filegrid-storage-credentials comes from
# scripts/k8s-secrets.sh, never from git.
resources:
  - namespace.yaml
  - postgres.yaml
  - s3.yaml
  - ftp.yaml
  - networkpolicies.yaml
