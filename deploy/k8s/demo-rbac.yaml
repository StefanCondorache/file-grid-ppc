# Least-privilege RBAC for the demo panel: the backend (ServiceAccount filegrid-backend in namespace filegrid,
# created by the app stream; a RoleBinding may reference it before it exists) may stop/start the three storages
# by scaling their StatefulSets to 0/1, and read their state. Nothing else:
#   - no delete/create on anything, no access to Secrets, PVCs, Services or NetworkPolicies;
#   - scale and get are pinned to the three StatefulSets by name (list/watch cannot be pinned by resourceNames,
#     they only expose the StatefulSet objects of this one namespace);
#   - only namespace filegrid-storage (a Role, not a ClusterRole).
# Network degradation (tc netem) is NOT exposed to the cluster: it needs root on the node (make chaos-netem-*).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filegrid-demo-storage-control
  namespace: filegrid-storage
  labels:
    app.kubernetes.io/part-of: filegrid
    app.kubernetes.io/component: demo-rbac
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["postgres", "s3", "ftp"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["postgres", "s3", "ftp"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filegrid-demo-storage-control
  namespace: filegrid-storage
  labels:
    app.kubernetes.io/part-of: filegrid
    app.kubernetes.io/component: demo-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: filegrid-demo-storage-control
subjects:
  - kind: ServiceAccount
    name: filegrid-backend
    namespace: filegrid
