name: filegrid

# Storage backends for FileGrid PPC: PostgreSQL (DB), SeaweedFS (S3), pure-ftpd (FTP).
# Every published port is bound to 127.0.0.1 (Docker bypasses ufw). Credentials come from infra/.env.

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible object storage: SeaweedFS all-in-one (master + volume + filer + S3 gateway).
  # S3 auth is enforced with the admin credentials from the AWS_* env vars (no config file needed).
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -s3.port=8333
      - -master.volumeSizeLimitMB=256
      - -volume.max=0   # 0 = auto: limit follows free disk (see docs/vps-setup.md)
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in infra/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in infra/.env}
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:9000:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # filer UI
    healthcheck:
      # master reports the cluster up, and the S3 gateway answers (anonymous => 403, so no -f on it)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates bucket "filegrid" idempotently through the authenticated S3 API, then exits 0.
  s3-init:
    image: amazon/aws-cli:2.40.3
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in infra/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in infra/.env}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-filegrid}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ep=http://s3:8333
        if aws --endpoint-url $$ep s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "bucket $$S3_BUCKET already exists"
        else
          aws --endpoint-url $$ep s3api create-bucket --bucket "$$S3_BUCKET"
          echo "bucket $$S3_BUCKET created"
        fi

  ftp:
    image: stilliard/pure-ftpd:bookworm-1.0.50
    restart: unless-stopped
    environment:
      FTP_USER_NAME: ${FTP_USER:?set in infra/.env}
      FTP_USER_PASS: ${FTP_PASSWORD:?set in infra/.env}
      FTP_USER_HOME: /home/ftpuser
      # Address advertised in PASV replies: loopback, so clients on the host work (see docs/vps-setup.md)
      PUBLICHOST: 127.0.0.1
      ADDED_FLAGS: "-p 21000:21009 -E"
    volumes:
      - ftpdata:/home/ftpuser
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:21000-21009:21000-21009"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/21"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  s3data:
  ftpdata:
