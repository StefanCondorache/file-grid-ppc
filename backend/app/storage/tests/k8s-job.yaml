# Integration tests of the storage adapters, run inside k3s (the storages are ClusterIP-only and their
# NetworkPolicies admit only pods in namespace filegrid labelled filegrid.io/storage-client=true).
# The 256Mi memory limit is the constant-memory proof: the suite streams 1 GiB through S3 and FTP and
# 256 MiB through PostgreSQL; an implementation that buffered whole objects would be OOM-killed.
# Use app/storage/tests/run-in-cluster.sh (build, import, run, logs, exit code, cleanup).
apiVersion: batch/v1
kind: Job
metadata:
  name: filegrid-storage-tests
  namespace: filegrid
  labels:
    app.kubernetes.io/name: filegrid-storage-tests
    app.kubernetes.io/part-of: filegrid
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filegrid-storage-tests
        filegrid.io/storage-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tests
          image: filegrid-storage-tests:local   # built and imported by run-in-cluster.sh
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: filegrid-storage-credentials}   # S3_*, FTP_*, POSTGRES_*
          env:
            - {name: FILEGRID_INTEGRATION, value: "1"}
            - {name: FILEGRID_S3_ENDPOINT, value: "http://s3.filegrid-storage.svc.cluster.local:8333"}
            - {name: FILEGRID_FTP_HOST, value: "ftp.filegrid-storage.svc.cluster.local"}
            - {name: FILEGRID_PG_HOST, value: "postgres.filegrid-storage.svc.cluster.local"}
            # Sizes of the big streaming tests in MiB (0 skips one); run-in-cluster.sh can override them.
            - {name: FILEGRID_TEST_BIG_S3_MB, value: "1024"}
            - {name: FILEGRID_TEST_BIG_FTP_MB, value: "1024"}
            - {name: FILEGRID_TEST_BIG_DB_MB, value: "256"}
            - {name: PYTEST_ADDOPTS, value: ""}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
